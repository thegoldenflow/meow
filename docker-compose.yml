services:
  postgres:
    image: postgres:16-alpine
    container_name: meow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-meow_dev}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meow_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-meow_dev}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    image: meow-api:latest
    container_name: meow-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      PERSISTENCE_BACKEND: pg
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-meow_password}@postgres:5432/${POSTGRES_DB:-meow_dev}}
      AUDIO_CDN_ORIGIN: ${AUDIO_CDN_ORIGIN:-https://your-bucket.cos.ap-shanghai.myqcloud.com}
      PRONUNCIATION_CDN_ORIGIN: ${PRONUNCIATION_CDN_ORIGIN:-https://your-bucket.cos.ap-shanghai.myqcloud.com}
      # 需求 24: audio 流量经服务端代理 COS internal endpoint
      # 本地未配 COS_* 时启动会被 assertAudioAccessModeReady 拒绝；要么 export
      # 凭证（vpn / 内网测试），要么显式覆盖 AUDIO_ACCESS_MODE=backend_issued_cos_url
      AUDIO_ACCESS_MODE: ${AUDIO_ACCESS_MODE:-backend_proxy_stream}
      API_PUBLIC_BASE: ${API_PUBLIC_BASE:-http://10.0.2.2:3000/api/v1}
      COS_INTERNAL_ENDPOINT: ${COS_INTERNAL_ENDPOINT:-}
      COS_REGION: ${COS_REGION:-ap-shanghai}
      COS_BUCKET: ${COS_BUCKET:-}
      COS_SECRET_ID: ${COS_SECRET_ID:-}
      COS_SECRET_KEY: ${COS_SECRET_KEY:-}
    ports:
      - "${API_PORT:-3000}:3000"
    command: ["sh", "-c", "node dist/infrastructure/postgres/migrate.js up && node dist/main.js"]

volumes:
  pg_data:
