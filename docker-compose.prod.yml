services:
  postgres:
    image: postgres:17-alpine
    container_name: meow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: ${TCR_REGISTRY:?TCR_REGISTRY is required}/${TCR_NAMESPACE:?TCR_NAMESPACE is required}/meow-api:${API_IMAGE_TAG:-latest}
    container_name: meow-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      PERSISTENCE_BACKEND: pg
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}}
      AUDIO_CDN_ORIGIN: ${AUDIO_CDN_ORIGIN:?AUDIO_CDN_ORIGIN is required}
      PRONUNCIATION_CDN_ORIGIN: ${PRONUNCIATION_CDN_ORIGIN:?PRONUNCIATION_CDN_ORIGIN is required}
      # 需求 24: audio 流量经服务端代理 COS internal endpoint
      AUDIO_ACCESS_MODE: ${AUDIO_ACCESS_MODE:-backend_proxy_stream}
      API_PUBLIC_BASE: ${API_PUBLIC_BASE:?API_PUBLIC_BASE is required}
      COS_INTERNAL_ENDPOINT: ${COS_INTERNAL_ENDPOINT:-https://cos-internal.ap-shanghai.tencentcos.cn}
      COS_REGION: ${COS_REGION:?COS_REGION is required}
      COS_BUCKET: ${COS_BUCKET:?COS_BUCKET is required}
      COS_SECRET_ID: ${COS_SECRET_ID:?COS_SECRET_ID is required}
      COS_SECRET_KEY: ${COS_SECRET_KEY:?COS_SECRET_KEY is required}
    command: ["sh", "-c", "node dist/infrastructure/postgres/migrate.js up && node dist/main.js"]

  caddy:
    image: caddy:2-alpine
    container_name: meow-caddy
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:-api.miaory.chat, miaory.chat}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pg_data:
  caddy_data:
  caddy_config:

